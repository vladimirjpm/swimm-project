name: CI

# Зелёный CI — условие мержа. Деплой отсюда НЕ идёт: он в azure-deploy.yml
# и запускается только руками (решение В13).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Сервер — сборка и тесты
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 1 не для скорости, а по необходимости: в истории репозитория
      # лежит ~348 МБ от удалённых видео, полный клон качает их каждый раз.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Кэш NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore server/Swimm.sln

      - run: dotnet build server/Swimm.sln -c Release --no-restore

      # Живая БД и докер тестам не нужны: два PG-теста сами отключаются, когда
      # Postgres недоступен. Поэтому services: postgres здесь сознательно нет.
      - name: Тесты
        run: dotnet test server/Swimm.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Результаты тестов
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  client:
    name: Клиент — типы и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      # vite build типы НЕ проверяет — он их просто стирает. Без этого шага
      # ошибка типа доезжает до прода.
      - name: Проверка типов
        run: npm run typecheck
        working-directory: client

      - run: npm run build
        working-directory: client

      # Прод раздаётся с корня одного origin, а чистые URL двухсегментные
      # (/swimmers/{id}). При относительном base браузер попросил бы
      # /swimmers/swimmer.js и получил 404 — страница не открылась бы вовсе.
      - name: Пути к ассетам должны быть абсолютными
        run: |
          if grep -q 'src="\./' client/dist/swimmer.html; then
            echo "::error file=client/vite.config.js::Относительный base вернулся: в dist/swimmer.html относительные пути. Ожидается base: '/'."
            grep -o 'src="[^"]*"' client/dist/swimmer.html | head
            exit 1
          fi
          echo "OK: пути абсолютные"

  admin-css:
    name: Бандл админки пересобран
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/Swimm.API/package-lock.json

      - run: npm ci
        working-directory: server/Swimm.API

      - run: npm run css:build
        working-directory: server/Swimm.API

      # admin.min.css коммитится (на машинах без Node сборка берёт готовый файл),
      # поэтому «забыл пересобрать после новых Tailwind-классов» ловится только так.
      - name: Собранный бандл совпадает с закоммиченным
        run: |
          if ! git diff --exit-code -- server/Swimm.API/wwwroot/css/admin.min.css; then
            echo "::error file=server/Swimm.API/wwwroot/css/admin.min.css::Бандл админки устарел. Выполни: npm --prefix server/Swimm.API run css:build — и закоммить результат."
            exit 1
          fi
