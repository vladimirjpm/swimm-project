<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>DB Schema Explorer</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;color:#333}
        .topbar{background:#1a1a2e;color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
        .topbar h1{font-size:1.3rem}
        .topbar nav a{color:rgba(255,255,255,.7);text-decoration:none;margin-left:20px;font-size:.9rem}
        .topbar nav a:hover{color:#fff}
        .layout{display:flex;max-width:1400px;margin:0 auto}
        .sidebar{width:220px;background:#fff;min-height:calc(100vh - 48px);padding:16px;border-right:1px solid #e0e0e0;position:sticky;top:48px}
        .sidebar h3{font-size:.85rem;color:#888;margin:16px 0 8px;text-transform:uppercase}
        .sidebar a{display:block;padding:6px 10px;border-radius:6px;text-decoration:none;color:#333;font-size:.85rem;margin-bottom:2px}
        .sidebar a:hover,.sidebar a.active{background:#4a6cf7;color:#fff}
        .main{flex:1;padding:24px}
        .toolbar{display:flex;gap:12px;margin-bottom:20px}
        .btn{padding:8px 20px;border:none;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:600}
        .btn-primary{background:#4a6cf7;color:#fff}
        .card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:20px}
        .card h2{margin-bottom:12px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
        .row-count{font-size:.75rem;background:#e8f4fd;color:#2980b9;padding:2px 8px;border-radius:10px}
        table{width:100%;border-collapse:collapse;font-size:.85rem}
        th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eee}
        th{background:#f8f9fa;font-weight:600}
        .pk{color:#e74c3c;font-weight:700}
        .nullable{color:#888}
        .fk-badge{background:#fef9e7;color:#f39c12;padding:2px 8px;border-radius:10px;font-size:.75rem}
        .section{margin-bottom:32px}
        .section h2{font-size:1.2rem;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #4a6cf7}
        pre{background:#1a1a2e;color:#e0e0e0;padding:16px;border-radius:8px;overflow-x:auto;font-size:.8rem;margin-top:8px}
        .tab-row{display:flex;gap:8px;margin-bottom:20px}
        .tab{padding:6px 16px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:.85rem}
        .tab.active{background:#4a6cf7;color:#fff;border-color:#4a6cf7}
    </style>
</head>
<body>
    <div class="topbar">
        <h1>DB Schema Explorer</h1>
        <nav>
            <a href="/admin/">Dashboard</a>
            <a href="/admin/db.html">DB Schema</a>
            <a href="/admin/settings.html">Settings</a>
            <a href="/">Home</a>
        </nav>
    </div>
    <div class="layout">
        <div class="sidebar" id="sidebar"><h3>Tables</h3></div>
        <div class="main" id="main">
            <div class="toolbar">
                <button class="btn btn-primary" onclick="load(true)">Refresh</button>
            </div>
            <div class="tab-row">
                <span class="tab active" data-tab="tables">Tables</span>
                <span class="tab" data-tab="fkeys">Foreign Keys</span>
                <span class="tab" data-tab="indexes">Indexes</span>
                <span class="tab" data-tab="sp">Stored Procs</span>
                <span class="tab" data-tab="views">Views</span>
            </div>
            <div id="content"></div>
        </div>
    </div>
<script>
let schema=null, activeTab="tables";
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active"); activeTab=t.dataset.tab; render();
}));
async function load(refresh=false){
    const r=await fetch(`/api/admin/db-schema?refresh=${refresh}`,{credentials:"include"});
    if(!r.ok){document.getElementById("content").innerHTML="<p>Error loading schema</p>";return;}
    schema=await r.json(); buildSidebar(); render();
}
function buildSidebar(){
    const sb=document.getElementById("sidebar");
    const counts=Object.fromEntries((schema.rowCounts||[]).map(r=>[r.table,r.count]));
    sb.innerHTML="<h3>Tables</h3>"+schema.tables.map(t=>
        `<a href="#tbl-${t.table}" onclick="scrollToTable('${t.table}')">${t.table} <span class="row-count">${counts[t.table]??""}</span></a>`
    ).join("");
}
function scrollToTable(name){
    activeTab="tables"; document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelector("[data-tab=tables]").classList.add("active"); render();
    setTimeout(()=>document.getElementById("tbl-"+name)?.scrollIntoView({behavior:"smooth"}),50);
}
function render(){
    const c=document.getElementById("content");
    if(!schema){c.innerHTML="<p>Loading...</p>";return;}
    const counts=Object.fromEntries((schema.rowCounts||[]).map(r=>[r.table,r.count]));
    const fkMap={};
    (schema.foreignKeys||[]).forEach(fk=>{if(!fkMap[fk.parentTable])fkMap[fk.parentTable]=[];fkMap[fk.parentTable].push(fk);});
    if(activeTab==="tables"){
        c.innerHTML=schema.tables.map(t=>{
            const tblFks=fkMap[t.table]||[];
            return `<div class="card" id="tbl-${t.table}"><h2>${t.table} <span class="row-count">${counts[t.table]??0} rows</span></h2>
            <table><thead><tr><th>Column</th><th>Type</th><th>Nullable</th><th>Default</th><th>Info</th></tr></thead><tbody>
            ${t.columns.map(col=>{
                const fk=tblFks.find(f=>f.parentColumn===col.column);
                return `<tr><td>${col.isPrimaryKey?`<span class="pk">PK</span> `:``}${col.column}</td>
                <td>${col.type}${col.maxLength?`(${col.maxLength})`:``}</td>
                <td>${col.nullable?`<span class="nullable">YES</span>`:`NO`}</td>
                <td>${col.defaultValue||""}</td>
                <td>${fk?`<span class="fk-badge">FK → ${fk.referencedTable}.${fk.referencedColumn}</span>`:``}</td></tr>`;
            }).join("")}</tbody></table></div>`;
        }).join("");
    } else if(activeTab==="fkeys"){
        c.innerHTML=`<div class="card"><h2>Foreign Keys</h2><table><thead><tr><th>Name</th><th>Parent</th><th>Column</th><th>Referenced</th><th>Column</th></tr></thead><tbody>
        ${(schema.foreignKeys||[]).map(f=>`<tr><td>${f.name}</td><td>${f.parentTable}</td><td>${f.parentColumn}</td><td>${f.referencedTable}</td><td>${f.referencedColumn}</td></tr>`).join("")}
        </tbody></table></div>`;
    } else if(activeTab==="indexes"){
        c.innerHTML=`<div class="card"><h2>Indexes</h2><table><thead><tr><th>Table</th><th>Index</th><th>Type</th><th>Unique</th><th>Columns</th></tr></thead><tbody>
        ${(schema.indexes||[]).map(i=>`<tr><td>${i.table}</td><td>${i.name}</td><td>${i.type}</td><td>${i.isUnique?"Yes":"No"}</td><td>${i.columns}</td></tr>`).join("")}
        </tbody></table></div>`;
    } else if(activeTab==="sp"){
        c.innerHTML=(schema.storedProcedures||[]).map(s=>`<div class="card"><h2>${s.name}</h2><pre>${s.definition||"-- definition not available"}</pre></div>`).join("")||"<p>No stored procedures</p>";
    } else if(activeTab==="views"){
        c.innerHTML=(schema.views||[]).map(v=>`<div class="card"><h2>${v.name}</h2><pre>${v.definition||"-- definition not available"}</pre></div>`).join("")||"<p>No views</p>";
    }
}
load();
</script>
</body>
</html>
