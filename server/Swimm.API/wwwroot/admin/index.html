<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swimm — Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(0,0,0,.3);
        }

            header h1 {
                color: #ff6b6b;
                font-size: 1.5rem;
            }

            header a {
                color: #4fc3f7;
                text-decoration: none;
                font-size: .9rem;
            }

                header a:hover {
                    text-decoration: underline;
                }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* Stats cards */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255,255,255,.07);
            border-radius: 10px;
            padding: 1.2rem;
            text-align: center;
        }

            .stat-card .value {
                font-size: 2rem;
                font-weight: 700;
                color: #4fc3f7;
            }

            .stat-card .label {
                font-size: .85rem;
                color: #90a4ae;
                margin-top: .3rem;
            }

        /* Tabs */
        .tabs {
            display: flex;
            gap: .5rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            padding: .5rem 1.2rem;
            border: 1px solid #4fc3f7;
            border-radius: 6px;
            background: transparent;
            color: #4fc3f7;
            cursor: pointer;
            font-size: .9rem;
            transition: background .2s;
        }

            .tab-btn:hover {
                background: rgba(79,195,247,.12);
            }

            .tab-btn.active {
                background: #4fc3f7;
                color: #0f3460;
            }

        .tab-content {
            display: none;
        }

            .tab-content.active {
                display: block;
            }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: .6rem .8rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        th {
            color: #90a4ae;
            font-weight: 600;
            font-size: .8rem;
            text-transform: uppercase;
        }

        td {
            font-size: .9rem;
        }

        .avatar-sm {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: .4rem;
        }

        .badge {
            display: inline-block;
            padding: .15rem .5rem;
            border-radius: 4px;
            font-size: .75rem;
            font-weight: 600;
        }

        .badge-admin {
            background: #ff6b6b;
            color: #fff;
        }

        .badge-user {
            background: #4fc3f7;
            color: #0f3460;
        }

        .badge-inactive {
            background: #546e7a;
            color: #cfd8dc;
        }

        .btn-sm {
            padding: .25rem .6rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: .8rem;
            color: #fff;
            transition: opacity .2s;
        }

            .btn-sm:hover {
                opacity: .8;
            }

        .btn-add {
            background: #66bb6a;
        }

        .btn-remove {
            background: #ef5350;
        }

        .btn-toggle {
            background: #ffa726;
        }

        .actions {
            display: flex;
            gap: .3rem;
            flex-wrap: wrap;
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: #323232;
            color: #fff;
            padding: .7rem 1.2rem;
            border-radius: 6px;
            font-size: .9rem;
            opacity: 0;
            transition: opacity .3s;
            z-index: 1000;
        }

            .toast.show {
                opacity: 1;
            }
    </style>
</head>
<body>

<header>
    <h1>🔧 Swimm Admin</h1>
    <div>
        <a href="/">← Home</a>
        &nbsp;&nbsp;
        <a href="/admin/db.html">🗄️ DB Schema</a>
        &nbsp;&nbsp;
        <a href="/admin/settings.html">⚙️ Settings</a>
        &nbsp;&nbsp;
        <a href="/auth/logout">Logout</a>
    </div>
</header>

<div class="container">
    <!-- Stats -->
    <div class="stats" id="stats-grid"></div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="users">👥 Users</button>
    </div>

    <!-- Users tab -->
    <div class="tab-content active" id="tab-users">
        <table>
            <thead>
                <tr>
                    <th>User</th>
                    <th>Email</th>
                    <th>Roles</th>
                    <th>Status</th>
                    <th>Registered</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="users-body"></tbody>
        </table>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(async function () {
    const API = '/api/admin';
    let allRoles = [];

    // --- Helpers ---
    async function api(url, opts = {}) {
        const res = await fetch(url, { credentials: 'same-origin', ...opts });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        return res.json();
    }

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2500);
    }

    function formatDate(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleDateString('ru-RU');
    }

    // --- Stats ---
    async function loadStats() {
        const s = await api(`${API}/stats`);
        const grid = document.getElementById('stats-grid');
        const items = [
            { label: 'Users', value: s.users },
            { label: 'Results', value: s.results.toLocaleString() },
            { label: 'Competitions', value: s.competitions },
            { label: 'Swimmers', value: s.swimmers.toLocaleString() },
            { label: 'Clubs', value: s.clubs },
        ];
        grid.innerHTML = items.map(i => `
            <div class="stat-card">
                <div class="value">${i.value}</div>
                <div class="label">${i.label}</div>
            </div>
        `).join('');
    }

    // --- Users ---
    async function loadUsers() {
        const users = await api(`${API}/users`);
        const tbody = document.getElementById('users-body');

        tbody.innerHTML = users.map(u => {
            const rolesHtml = u.roles.map(r =>
                `<span class="badge ${r === 'Admin' ? 'badge-admin' : 'badge-user'}">${r}</span> `
            ).join('');

            const statusHtml = u.isActive
                ? '<span style="color:#66bb6a">Active</span>'
                : '<span class="badge badge-inactive">Inactive</span>';

            const avatarHtml = u.avatarUrl
                ? `<img class="avatar-sm" src="${u.avatarUrl}" alt="">`
                : '';

            // Role toggle buttons
            const missingRoles = allRoles.filter(r => !u.roles.includes(r.name));
            const addBtns = missingRoles.map(r =>
                `<button class="btn-sm btn-add" onclick="addRole(${u.id}, ${r.id})">+ ${r.name}</button>`
            ).join('');

            const removeBtns = u.roles.map(rName => {
                const role = allRoles.find(r => r.name === rName);
                return role
                    ? `<button class="btn-sm btn-remove" onclick="removeRole(${u.id}, ${role.id})">&minus; ${rName}</button>`
                    : '';
            }).join('');

            const toggleBtn = `<button class="btn-sm btn-toggle" onclick="toggleActive(${u.id}, ${!u.isActive})">${u.isActive ? 'Disable' : 'Enable'}</button>`;

            return `<tr>
                <td>${avatarHtml}${u.displayName}</td>
                <td>${u.email}</td>
                <td>${rolesHtml}</td>
                <td>${statusHtml}</td>
                <td>${formatDate(u.createdAt)}</td>
                <td><div class="actions">${addBtns}${removeBtns}${toggleBtn}</div></td>
            </tr>`;
        }).join('');
    }

    // --- Actions (global) ---
    window.addRole = async function (userId, roleId) {
        await api(`${API}/users/${userId}/roles/${roleId}`, { method: 'POST' });
        toast('Role added');
        loadUsers();
    };

    window.removeRole = async function (userId, roleId) {
        await api(`${API}/users/${userId}/roles/${roleId}`, { method: 'DELETE' });
        toast('Role removed');
        loadUsers();
    };

    window.toggleActive = async function (userId, isActive) {
        await api(`${API}/users/${userId}/active`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ isActive })
        });
        toast(isActive ? 'User activated' : 'User deactivated');
        loadUsers();
    };

    // --- Tabs ---
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
    });

    // --- Init ---
    try {
        allRoles = await api(`${API}/roles`);
        await Promise.all([loadStats(), loadUsers()]);
    } catch (e) {
        console.error('Admin init failed', e);
        document.querySelector('.container').innerHTML =
            '<p style="color:#ef5350;text-align:center;padding:3rem;">Failed to load admin data. Make sure you have Admin role.</p>';
    }
})();
</script>

</body>
</html>
