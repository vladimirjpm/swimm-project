<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swimm — Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 960px;
            padding: 2rem 1rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            header h1 {
                font-size: 1.8rem;
                color: #4fc3f7;
            }

        .user-bar {
            display: flex;
            align-items: center;
            gap: .75rem;
        }

            .user-bar img {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                border: 2px solid #4fc3f7;
            }

            .user-bar span {
                font-size: .95rem;
            }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .55rem 1.2rem;
            border-radius: 6px;
            border: none;
            font-size: .95rem;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            transition: opacity .2s;
        }

            .btn:hover {
                opacity: .85;
            }

        .btn-google {
            background: #4285f4;
        }

            .btn-google svg {
                width: 18px;
                height: 18px;
            }

        .btn-logout {
            background: #546e7a;
            font-size: .85rem;
            padding: .4rem .9rem;
        }

        main {
            width: 100%;
            max-width: 960px;
            padding: 1rem;
            flex: 1;
        }

        .hero {
            text-align: center;
            padding: 3rem 1rem;
        }

            .hero h2 {
                font-size: 2rem;
                margin-bottom: 1rem;
                color: #fff;
            }

            .hero p {
                font-size: 1.1rem;
                color: #b0bec5;
                margin-bottom: 2rem;
            }

        .nav-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

            .nav-links a {
                color: #4fc3f7;
                text-decoration: none;
                font-size: 1rem;
                padding: .5rem 1rem;
                border: 1px solid #4fc3f7;
                border-radius: 6px;
                transition: background .2s;
            }

                .nav-links a:hover {
                    background: rgba(79,195,247,.15);
                }

        .profile-card {
            background: rgba(255,255,255,.06);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1rem auto;
            max-width: 480px;
        }

            .profile-card h3 {
                color: #4fc3f7;
                margin-bottom: .75rem;
            }

            .profile-card .row {
                display: flex;
                justify-content: space-between;
                padding: .3rem 0;
            }

            .profile-card .label {
                color: #90a4ae;
            }

        .hidden {
            display: none;
        }

        footer {
            padding: 1.5rem;
            text-align: center;
            font-size: .8rem;
            color: #546e7a;
        }
    </style>
</head>
<body>

<header>
    <h1>🏊 Swimm</h1>
    <div id="auth-area"></div>
</header>

<main>
    <div class="hero">
        <h2>Swimming Results Platform</h2>
        <p>Результаты соревнований, рекорды, статистика.</p>

        <!-- Кнопка логина (видна когда не залогинен) -->
        <div id="login-section">
            <a class="btn btn-google" href="/auth/login/google">
                <svg viewBox="0 0 24 24" fill="white"><path d="M21.35 11.1h-9.18v2.85h5.28c-.5 2.47-2.63 3.85-5.28 3.85a5.85 5.85 0 0 1 0-11.7c1.4 0 2.68.5 3.68 1.32l2.15-2.15A9.15 9.15 0 0 0 12.17 3 9 9 0 1 0 21.35 11.1z"/></svg>
                Sign in with Google
            </a>
        </div>

        <!-- Профиль (виден когда залогинен) -->
        <div id="profile-section" class="hidden">
            <div class="profile-card">
                <h3>Ваш профиль</h3>
                <div class="row"><span class="label">Имя:</span> <span id="p-name"></span></div>
                <div class="row"><span class="label">Email:</span> <span id="p-email"></span></div>
                <div class="row"><span class="label">Роли:</span> <span id="p-roles"></span></div>
            </div>
        </div>

        <div class="nav-links">
            <a href="/api/results?page=1&pageSize=20">📊 API Results</a>
            <a id="admin-link" href="/admin/" class="hidden">🔧 Admin Panel</a>
        </div>
    </div>
</main>

<footer>
    Swimm &copy; 2025
</footer>

<script>
    (async function () {
        const authArea = document.getElementById('auth-area');
        const loginSection = document.getElementById('login-section');
        const profileSection = document.getElementById('profile-section');

        try {
            const res = await fetch('/auth/me', { credentials: 'same-origin' });
            const data = await res.json();

            if (data.isAuthenticated) {
                loginSection.classList.add('hidden');
                profileSection.classList.remove('hidden');

                document.getElementById('p-name').textContent = data.displayName;
                document.getElementById('p-email').textContent = data.email;
                document.getElementById('p-roles').textContent = (data.roles || []).join(', ');

                let userHtml = '';
                if (data.avatarUrl) {
                    userHtml += `<img src="${data.avatarUrl}" alt="avatar" />`;
                }
                userHtml += `<span>${data.displayName}</span>`;
                userHtml += `<a class="btn btn-logout" href="/auth/logout">Выйти</a>`;
                authArea.innerHTML = userHtml;

                if ((data.roles || []).includes('Admin')) {
                    document.getElementById('admin-link').classList.remove('hidden');
                }
            }
        } catch (e) {
            console.warn('Auth check failed', e);
        }
    })();
</script>

</body>
</html>
