<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swimm — Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/home.css" />
</head>
<body class="font-sans min-h-screen flex flex-col items-center text-gray-300">

<header class="w-full max-w-[960px] pt-8 px-4 pb-4 flex justify-between items-center">
    <h1 class="text-3xl text-[#4fc3f7]">🏊 Swimm</h1>
    <div id="auth-area" class="flex items-center gap-3"></div>
</header>

<main class="w-full max-w-[960px] p-4 flex-1">
    <div class="text-center py-12 px-4">
        <h2 class="text-3xl mb-4 text-white">Swimming Results Platform</h2>
        <p class="text-lg text-[#b0bec5] mb-8">Результаты соревнований, рекорды, статистика.</p>

        <!-- Кнопка логина (видна когда не залогинен) -->
        <div id="login-section">
            <a class="inline-flex items-center gap-2 py-2 px-5 rounded-md bg-[#4285f4] text-white text-sm no-underline cursor-pointer transition-opacity hover:opacity-85" href="/auth/login/google">
                <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="white"><path d="M21.35 11.1h-9.18v2.85h5.28c-.5 2.47-2.63 3.85-5.28 3.85a5.85 5.85 0 0 1 0-11.7c1.4 0 2.68.5 3.68 1.32l2.15-2.15A9.15 9.15 0 0 0 12.17 3 9 9 0 1 0 21.35 11.1z"/></svg>
                Sign in with Google
            </a>
        </div>

        <!-- Профиль (виден когда залогинен) -->
        <div id="profile-section" class="hidden">
            <div class="bg-white/[.06] rounded-xl p-6 mx-auto my-4 max-w-[480px]">
                <h3 class="text-[#4fc3f7] mb-3">Ваш профиль</h3>
                <div class="flex justify-between py-1"><span class="text-[#90a4ae]">Имя:</span> <span id="p-name"></span></div>
                <div class="flex justify-between py-1"><span class="text-[#90a4ae]">Email:</span> <span id="p-email"></span></div>
                <div class="flex justify-between py-1"><span class="text-[#90a4ae]">Роли:</span> <span id="p-roles"></span></div>
            </div>
        </div>

        <div class="flex gap-4 justify-center flex-wrap mt-8">
            <a href="/admin/api.html" class="text-[#4fc3f7] no-underline text-base py-2 px-4 border border-[#4fc3f7] rounded-md transition-colors hover:bg-[rgba(79,195,247,0.15)]">📡 API Reference</a>
            <a id="admin-link" href="/admin/" class="hidden text-[#4fc3f7] no-underline text-base py-2 px-4 border border-[#4fc3f7] rounded-md transition-colors hover:bg-[rgba(79,195,247,0.15)]">🔧 Admin Panel</a>
        </div>
    </div>
</main>

<footer class="p-6 text-center text-xs text-[#546e7a]">
    Swimm &copy; 2025
</footer>

<script>
    (async function () {
        const authArea = document.getElementById('auth-area');
        const loginSection = document.getElementById('login-section');
        const profileSection = document.getElementById('profile-section');

        try {
            const res = await fetch('/auth/me', { credentials: 'same-origin' });
            const data = await res.json();

            if (data.isAuthenticated) {
                loginSection.classList.add('hidden');
                profileSection.classList.remove('hidden');

                document.getElementById('p-name').textContent = data.displayName;
                document.getElementById('p-email').textContent = data.email;
                document.getElementById('p-roles').textContent = (data.roles || []).join(', ');

                let userHtml = '';
                if (data.avatarUrl) {
                    userHtml += `<img class="w-9 h-9 rounded-full border-2 border-[#4fc3f7]" src="${data.avatarUrl}" alt="avatar" />`;
                }
                userHtml += `<span class="text-[0.95rem]">${data.displayName}</span>`;
                userHtml += `<a class="inline-flex items-center gap-2 py-1.5 px-3.5 rounded-md bg-[#546e7a] text-white text-sm no-underline cursor-pointer transition-opacity hover:opacity-85" href="/auth/logout">Выйти</a>`;
                authArea.innerHTML = userHtml;

                if ((data.roles || []).includes('Admin')) {
                    document.getElementById('admin-link').classList.remove('hidden');
                }
            }
        } catch (e) {
            console.warn('Auth check failed', e);
        }
    })();
</script>

</body>
</html>
