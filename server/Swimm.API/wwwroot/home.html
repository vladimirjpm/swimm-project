<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swimm - Home</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .hero { text-align: center; color: #fff; padding: 2rem; }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
        .hero p { font-size: 1.2rem; opacity: 0.9; margin-bottom: 2rem; }
        .btn { display: inline-block; padding: 12px 32px; background: #fff; color: #764ba2; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 1rem; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-2px); }
        .links { margin-top: 2rem; }
        .links a { color: rgba(255,255,255,0.8); margin: 0 1rem; text-decoration: none; }
        .links a:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Swimm</h1>
        <p>Swimming Results Platform</p>
        <a href="/api/auth/google-login" class="btn">Sign in with Google</a>
        <div class="links">
            <a href="/api/results">Results API</a>
            <a href="/admin/">Admin Panel</a>
        </div>
    </div>
</body>
</html>
