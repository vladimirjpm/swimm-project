services:
  postgres:
    image: postgres:16
    container_name: swimm-postgres
    environment:
      POSTGRES_DB: swimm
      POSTGRES_USER: swimm
      POSTGRES_PASSWORD: swimm_local_dev
    ports:
      - "5432:5432"
    volumes:
      - swimm-pgdata:/var/lib/postgresql/data

volumes:
  swimm-pgdata:
