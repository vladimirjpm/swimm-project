services:
  postgres:
    image: postgres:16
    container_name: swimm-postgres
    environment:
      POSTGRES_DB: swimm
      POSTGRES_USER: swimm
      POSTGRES_PASSWORD: swimm_local_dev
    ports:
      # Хост-порт 5445 (легко запомнить): 5432 и 5433 заняты контейнерами других
      # проектов на этой машине (analyst_db, local-dev_db). Внутри контейнера порт
      # остаётся 5432 — поэтому `docker exec swimm-postgres psql …` работает без изменений.
      # Только 127.0.0.1: пароль выше публичен (репо открыт), и без привязки база была бы
      # доступна любому устройству в той же сети (Wi-Fi гостей, кафе) с правами владельца.
      - "127.0.0.1:5445:5432"
    volumes:
      - swimm-pgdata:/var/lib/postgresql/data

volumes:
  swimm-pgdata:
