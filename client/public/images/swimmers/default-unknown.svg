<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Swimmer portrait, gender not specified">
  <!--
    Портрет «пол не указан» — третий дефолт рядом с default-male.png / default-female.png.
    Заведён 21.09.2026: правило выбора портрета было «male ? мужской : женский», то есть
    ОТСУТСТВИЕ пола выдавалось за женский. Догадка выглядела как факт.

    Нарисован ОДНИМ ЧЁРНЫМ КОНТУРОМ, без цветных заливок (решение Влада 21.09.2026): двое
    других раскрашены, и третий цветной читался бы как ещё один пол. Контур говорит «портрета
    нет», а не «вот такой человек». По той же причине здесь нет ни бровей, ни носа, ни
    причёски: чем меньше черт, тем меньше поводов прочитать в рисунке конкретного человека.

    Белая подложка круга — единственная заливка, и она обязательна: аватар живёт и на тёмной
    теме (deep), где чёрные линии на прозрачном фоне пропали бы совсем.

    Плечи заходят за круг намеренно и обрезаны по нему (`clipPath`) — так же, как у обоих
    PNG: портрет «выходит из кадра», а не висит фигуркой внутри.
  -->
  <defs>
    <clipPath id="frame">
      <circle cx="320" cy="320" r="294"/>
    </clipPath>
  </defs>

  <circle cx="320" cy="320" r="294" fill="#FFFFFF"/>

  <g clip-path="url(#frame)" fill="none" stroke="#0F1720" stroke-width="16"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Плечи: дуга, уходящая за нижний край круга -->
    <path d="M132 640c0-92 84-150 188-150s188 58 188 150"/>
    <!-- Шея -->
    <path d="M272 438v46c0 14 21 24 48 24s48-10 48-24v-46"/>

    <!-- Голова -->
    <ellipse cx="320" cy="290" rx="128" ry="148"/>
    <!-- Уши -->
    <path d="M192 268c-20 0-34 16-34 34s14 34 34 34"/>
    <path d="M448 268c20 0 34 16 34 34s-14 34-34 34"/>

    <!-- Шапочка: только линия посадки, волос нет -->
    <path d="M196 246c22-58 68-96 124-96s102 38 124 96"/>

    <!-- Очки: две линзы, перемычка, ремешок к краям головы -->
    <rect x="204" y="252" width="102" height="66" rx="33"/>
    <rect x="334" y="252" width="102" height="66" rx="33"/>
    <path d="M306 285h28"/>
    <path d="M204 285h-14M436 285h14"/>

    <!-- Рот: одна короткая дуга, больше черт не нужно -->
    <path d="M286 382c12 12 22 18 34 18s22-6 34-18"/>
  </g>

  <!-- Обводка самого кадра — поверх обрезанных плеч, иначе они рвут край круга. -->
  <circle cx="320" cy="320" r="294" fill="none" stroke="#0F1720" stroke-width="16"/>
</svg>
